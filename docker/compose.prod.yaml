# Mizan Production Docker Compose Architecture
name: mizan-prod

networks:
  mizan_edge_net:
    driver: bridge
  mizan_internal_net:
    driver: bridge
    internal: true
  mizan_webhook_net:
    driver: bridge

volumes:
  mongodb_prod_data:
  redis_prod_data:
  backups_data:

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mizan-edge-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - mizan_edge_net
    depends_on:
      - api
      - ingest
      - web

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: mizan-web
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - mizan_edge_net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: always
    env_file:
      - ../.env
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - mizan_edge_net
      - mizan_internal_net
    depends_on:
      - mongodb
      - redis

  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingest
    restart: always
    env_file:
      - ../.env
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    networks:
      - mizan_edge_net
      - mizan_internal_net
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: mizan-worker
    restart: always
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - mizan_internal_net
      - mizan_webhook_net
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7.0
    container_name: mizan-prod-mongodb
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mizan_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-prod_secure_password_replace_in_env}
    volumes:
      - mongodb_prod_data:/data/db
      - backups_data:/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
    networks:
      - mizan_internal_net

  redis:
    image: redis:7.2-alpine
    container_name: mizan-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
    networks:
      - mizan_internal_net
