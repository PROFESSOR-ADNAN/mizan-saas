# Upstreams
upstream mizan_api_backend {
    server api:4000;
    keepalive 32;
}

upstream mizan_ingest_backend {
    server ingest:4001;
    keepalive 64;
}

upstream mizan_web_frontend {
    server web:80;
    keepalive 16;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mizan.example.com api.mizan.example.com ingest.mizan.example.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mizan.example.com api.mizan.example.com ingest.mizan.example.com localhost;

    ssl_certificate /etc/letsencrypt/live/mizan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mizan.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10M;

    # 1. High-Volume Ingestion API
    location /api/v1/ingest {
        limit_req zone=ingest_limit burst=100 nodelay;

        proxy_pass http://mizan_ingest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 2. Strict Auth Rate Limiting
    location ~* ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://mizan_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Management REST API
    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://mizan_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 4. React SPA Frontend
    location / {
        proxy_pass http://mizan_web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON formatted error responses for API routes
    error_page 429 = @rate_limit_error;
    location @rate_limit_error {
        default_type application/json;
        return 429 '{"error":{"message":"Too many requests, please slow down. Rate limit exceeded.","code":"RATE_LIMIT_EXCEEDED"}}';
    }
}
