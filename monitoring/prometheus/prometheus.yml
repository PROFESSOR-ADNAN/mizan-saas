global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "mizan-api"
    static_configs:
      - targets: ["api:4000"]
    metrics_path: "/metrics"

  - job_name: "mizan-ingest"
    static_configs:
      - targets: ["ingest:4001"]
    metrics_path: "/metrics"

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "mongodb-exporter"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
