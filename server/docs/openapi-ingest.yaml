openapi: 3.1.0
info:
  title: Mizan High-Volume Ingestion & Key API
  description: |
    High-volume ingestion endpoint supporting batches up to 100 events, deduplicated by client `eventId`.
    
    ### Copy-Paste cURL Example
    ```bash
    curl -X POST https://ingest.mizan.et/ingest/v1/events \
      -H "Authorization: Bearer mzn_live_a1b2c3d4_..." \
      -H "Content-Type: application/json" \
      -d '{
        "events": [
          {
            "eventId": "pos_rec_98213",
            "type": "sale",
            "occurredAt": "2026-11-01T12:00:00Z",
            "amount": 150000,
            "currency": "ETB",
            "channel": "Store Front",
            "branch": "Bole",
            "items": [
              { "sku": "ETH-COFFEE-500G", "name": "Yirgacheffe Roast", "qty": 2, "unitPrice": 75000 }
            ]
          }
        ]
      }'
    ```

    ### 20-Line Node.js / JavaScript Ingestion Snippet
    ```javascript
    import fetch from 'node:fetch';

    async function pushSaleEvent(apiKey, saleData) {
      const response = await fetch('https://ingest.mizan.et/ingest/v1/events', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          events: [{
            eventId: `evt_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            type: 'sale',
            occurredAt: new Date().toISOString(),
            amount: Math.round(saleData.etbTotal * 100), // Convert ETB to santim
            currency: 'ETB',
            channel: saleData.channel || 'Telegram',
            branch: saleData.branch || 'Main',
            items: saleData.items || []
          }]
        })
      });
      return response.json();
    }
    ```
  version: 1.0.0
servers:
  - url: http://localhost:4001/ingest/v1
    description: Local Dev Ingest
  - url: https://ingest.mizan.et/ingest/v1
    description: Production Ingest

paths:
  /events:
    post:
      summary: Batch ingest events (up to 100 events / 256 KB)
      operationId: ingestBatch
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [eventId, type, occurredAt]
                    properties:
                      eventId: { type: string, maxLength: 128 }
                      type: { type: string, enum: [sale, expense, custom] }
                      occurredAt: { type: string, format: date-time }
                      amount: { type: integer, minimum: 0, description: "Integer santim (1 ETB = 100 santim)" }
                      currency: { type: string, default: "ETB" }
                      channel: { type: string, maxLength: 100 }
                      branch: { type: string, maxLength: 100 }
                      customerRef: { type: string, maxLength: 128 }
      responses:
        '202':
          description: Events accepted and durably persisted to MongoDB
          headers:
            X-Quota-Remaining:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  rejected: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string }
                        status: { type: string, enum: [accepted, duplicate, rejected] }
                        reason: { type: string }
        '429':
          description: Quota or rate limit exceeded
        '503':
          description: Ingestion backpressure active

  /usage:
    get:
      summary: Get remaining quota for API key organization
      operationId: getIngestUsage
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Quota status

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "Format: mzn_live_{prefix}_{random}_{crc32}"
