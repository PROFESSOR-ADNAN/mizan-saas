repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --ext .ts,.tsx,.js
        language: system
        types: [file]
        files: \.(ts|tsx|js)$

      - id: typecheck
        name: typecheck
        entry: npm run build:shared
        language: system
        pass_filenames: false
